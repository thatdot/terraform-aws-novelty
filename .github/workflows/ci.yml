# Validates the module works with AWS
# Runs plan, apply, verify, and destroy on every PR, merge to main, and daily schedule
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 3 AM UTC
    - cron: '0 3 * * *'

permissions:
  id-token: write
  contents: read

# Prevent concurrent runs from conflicting on Terraform state
# Static group ensures only one run at a time across all PRs/branches
concurrency:
  group: terraform-ci
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TF_VAR_container_image: ${{ secrets.CONTAINER_IMAGE }}
  # ARN of a pre-existing Secrets Manager secret; the key itself never reaches CI
  TF_VAR_license_key_secret_arn: ${{ secrets.LICENSE_KEY_SECRET_ARN }}
  TF_VAR_license_server_uri: ${{ secrets.LICENSE_SERVER_URI }}

jobs:
  test:
    name: Plan + Apply + Verify + Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          # Disable wrapper to allow capturing output with $(terraform output -raw ...)
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          echo "alb_url=$(terraform output -raw alb_url)" >> $GITHUB_OUTPUT
          echo "ecs_cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "ecs_service_name=$(terraform output -raw ecs_service_name)" >> $GITHUB_OUTPUT
          echo "ecs_task_definition_arn=$(terraform output -raw ecs_task_definition_arn)" >> $GITHUB_OUTPUT

      - name: Verify License Key Is Not In Task Definition
        working-directory: .
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ steps.tf-outputs.outputs.ecs_task_definition_arn }} \
            --query 'taskDefinition.containerDefinitions[0]')
          if echo "$TASK_DEF" | jq -e '[.environment[].value] | any(test("license-key"))' > /dev/null; then
            echo "License key setting found in plain-text container environment"
            exit 1
          fi
          echo "$TASK_DEF" | jq -e '.secrets | any(.name == "CONFIG_FORCE_thatdot_novelty_license__key")' > /dev/null
          echo "License key is injected as a container secret only"

      - name: Wait for ECS Service Healthy
        working-directory: .
        run: |
          echo "Waiting for ECS service to stabilize (includes ALB health checks)..."
          aws ecs wait services-stable \
            --cluster ${{ steps.tf-outputs.outputs.ecs_cluster_name }} \
            --services ${{ steps.tf-outputs.outputs.ecs_service_name }}
          echo "ECS service is stable and healthy!"

      - name: Verify Novelty Responds Through ALB
        working-directory: .
        run: |
          ALB_URL="${{ steps.tf-outputs.outputs.alb_url }}"
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$ALB_URL/api/v2/system/readiness" || true)
            if [ "$STATUS" = "204" ] || [ "$STATUS" = "200" ]; then
              echo "Novelty is ready (HTTP $STATUS). Deployed version:"
              curl -s "$ALB_URL/api/v2/system/systemInfo" | jq .
              exit 0
            fi
            echo "Attempt $i: readiness returned HTTP $STATUS, waiting..."
            sleep 10
          done
          echo "Novelty did not become ready through the ALB"
          exit 1

      - name: Terraform Destroy
        if: always()
        run: terraform destroy -auto-approve -input=false

      - name: Notify Slack on Failure
        if: failure() && github.event_name != 'pull_request'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ CI Failed: ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ CI Failed*\n*Repo:* `${{ github.repository }}`\n*Branch:* `${{ github.head_ref || github.ref_name }}`\n*Triggered by:* ${{ github.actor }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
